# Netlify configuration for Booth Builder (static Vite SPA).
# The app is entirely client-side — no serverless functions are required —
# so this just builds the Vite bundle and serves it from dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send unknown routes back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets produced by Vite.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
